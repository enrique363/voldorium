; Voldorium settings (README.txt has more). Most of them are also in the game: GRAPHICS
; in the main menu. A line starting with ; is a note; changes here apply at the next start.

[game]
; your disc dump (the .gdi file); delete this line to choose another
disc = {disc}
; the Dreamcast system font file (optional)
font = biosfont.bin
; 1: ask the lobby server for a newer version at the main menu (sends only the version), 0: never
update_check = 1

[video]
; 1 full screen, 0 a window (Alt+Enter or F11 switch while playing)
fullscreen = 1
; native (your monitor's) or a 16:9 size such as 1920x1080: the size the game is drawn at
resolution = native
; the window's size when not full screen
window = 1280x720
; anti-aliasing: 0 (off), 2, 4 or 8
msaa = 4
; 4:3 menu and loading pictures: stretch, blur (blurred sides) or replace (art16x9 folder)
backgrounds = stretch
; fight HUD: 4:3 (as in the original), middle (halfway out) or edges (screen sides)
hud = 4:3
; menu and HUD text: smooth (upscaled) or sharp (the original pixels)
text = smooth
; 1 on (no tearing), 0 off (lowest input delay)
vsync = 1

[audio]
; 0: no sound at all (the game starts without an audio device)
enabled = 1
; sound volume in percent, 0 to 200
volume = 100

[keys]
; keyboard: SDL key names (Up, Z, Return, Left Shift...). a b x y = the Dreamcast buttons, l r = triggers
up = Up
down = Down
left = Left
right = Right
a = Z
b = X
x = A
y = S
start = Return
l = Q
r = W

[pad]
; controller shoulder buttons (lb rb) and triggers (lt rt): Dreamcast buttons a b x y l r start, joined with + for several at once (a+b)
lb = l
rb = r
lt = l
rt = r

[net]
; UDP port for online play (the lobby and manual connections)
port = 7000
; manual connection only: the other player's address:port
peer =
; manual connection only: 1 or 2
player = 1
; fight input delay in frames online (default 2; rollback covers the rest)
delay = 2
; menu input delay in frames online; raise it if menus stutter over long distances
menu_delay = 8
