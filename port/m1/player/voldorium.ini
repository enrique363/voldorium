; Voldorium settings (see README.txt)

[game]
disc = {disc}
font = biosfont.bin

[video]
fullscreen = 1
resolution = native
window = 1280x720
msaa = 4
backgrounds = stretch
text = smooth
vsync = 1

[audio]
enabled = 1
volume = 100

[keys]
up = Up
down = Down
left = Left
right = Right
a = Z
b = X
x = A
y = S
start = Return
l = Q
r = W

[net]
port = 7000
peer =
player = 1
delay = 2
menu_delay = 8
